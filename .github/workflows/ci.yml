name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q

  collect:
    # Rebuilds both target states and re-runs the real scans, so the numbers in the reports are reproducible.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python run_all.py
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            results/
            reports/
            vendor/assessment_report.md
